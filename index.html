<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wizwazwuz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #030a16;
      color: #20dfb3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Outer Hero Container */
    .hero {
      position: relative;
      perspective: 1000px;
      text-align: center;
      user-select: none;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Floating animation for the title */
    .float-wrapper {
      animation: gentleFloat 4s ease-in-out infinite alternate;
      transform-style: preserve-3d;
    }

    /* Interactive 3D tilt applied ONLY to the text title */
    .tilt-card {
      transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform-style: preserve-3d;
      will-change: transform;
      cursor: pointer;
    }

    .title {
      font-size: clamp(3.5rem, 12vw, 7.5rem);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      color: #20dfb3;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Navigation Links Outside Tilt Container */
    .nav-links {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 20;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #20dfb3;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      padding: 6px 12px;
      transition: opacity 0.2s, transform 0.2s;
    }

    .nav-btn:hover {
      opacity: 0.6;
      transform: scale(1.05);
    }

    .divider {
      color: #20dfb3;
      font-size: 0.75rem;
      font-weight: 800;
    }

    /* Center Overlay Panel */
    .overlay-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 10, 22, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }

    .overlay-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      background: #091b36;
      width: 380px;
      max-width: 85vw;
      height: 90vh;
      padding: 40px 30px;
      overflow-y: auto;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay-backdrop.active .modal-panel {
      transform: scale(1);
    }

    /* Editable Content Text & Links */
    .modal-content {
      color: #20dfb3;
      font-size: 1rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .modal-content p {
      margin-bottom: 6px;
    }

    .project-item {
      margin-bottom: 20px;
    }

    .project-item h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .project-item a {
      color: #20dfb3;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .project-item a:hover {
      text-decoration: underline;
      opacity: 0.8;
    }

    .project-item p {
      font-size: 0.9rem;
      opacity: 0.85;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- Landing Display -->
  <div class="hero">
    <div class="float-wrapper">
      <div class="tilt-card" id="tiltCard">
        <h1 class="title">wizwazwuz</h1>
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="nav-links">
      <button class="nav-btn" onclick="openModal('projectsModal')">PROJECTS</button>
      <span class="divider">•</span>
      <button class="nav-btn" onclick="openModal('aboutModal')">ABOUT</button>
    </div>
  </div>

  <!-- ABOUT OVERLAY PANEL -->
  <div class="overlay-backdrop" id="aboutModal" onclick="closeOnBackdrop(event, 'aboutModal')">
    <div class="modal-panel">
      <div class="modal-content">
        <!-- EDIT YOUR ABOUT TEXT HERE -->
        <p>Lorem ipsum Lorem ipsum</p>
        <p>Lorem ipsum Lorem ipsum</p>
        <p>Lorem ipsum Lorem ipsum</p>
        <p>Lorem ipsum Lorem ipsum</p>
        <p>Lorem ipsum Lorem ipsum</p>
        <p>Lorem ipsum Lorem ipsum</p>
        <p>Lorem ipsum Lorem ipsum</p>
      </div>
    </div>
  </div>

  <!-- PROJECTS OVERLAY PANEL -->
  <div class="overlay-backdrop" id="projectsModal" onclick="closeOnBackdrop(event, 'projectsModal')">
    <div class="modal-panel">
      <div class="modal-content">
        <!-- SINGLE EDITABLE PROJECT ITEM -->
        <div class="project-item">
          <h3>
            <a href="https://github.com/wizwazwuz" target="_blank" rel="noopener noreferrer">
              project 1 &nearr;
            </a>
          </h3>
          <p>Description for your project goes here.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('tiltCard');
    const MAX_TILT = 22;

    // Smooth mouse tilt tracking across full window
    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) - 0.5;
      const y = (e.clientY / window.innerHeight) - 0.5;

      const rotateX = -y * MAX_TILT;
      const rotateY = x * MAX_TILT;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    // Modal Display Functions
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function closeOnBackdrop(event, id) {
      if (event.target.classList.contains('overlay-backdrop')) {
        closeModal(id);
      }
    }
  </script>

</body>
</html>
