<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - wizwazwuz.github.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --sky-blue: #9BE0FF;
      --electric-blue: #3B92EC;
      --deep-navy: #114285;
      --surface: #ffffff;
      --on-surface: #191c1e;
      --outline: #dbe4ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(135deg, #eef7ff 0%, #dbeeff 100%);
      color: var(--on-surface);
      overflow-y: auto;
    }

    .app-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid rgba(59, 146, 236, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 700;
      font-size: 1.3rem;
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .nav-btn.active {
      background: var(--electric-blue);
      color: #ffffff;
    }

    .heading-bar {
      margin-bottom: 1.5rem;
    }

    .heading-bar h1 {
      font-size: 1.8rem;
      color: var(--deep-navy);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(17, 66, 133, 0.08);
      border: 1px solid var(--outline);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .tag {
      background: #eef7ff;
      color: var(--electric-blue);
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .project-card h3 {
      color: var(--deep-navy);
      font-size: 1.2rem;
      margin-bottom: 0.4rem;
    }

    .project-card p {
      color: #55606e;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid #f0f4f8;
    }

    .card-link {
      color: var(--electric-blue);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <a href="index.html" class="brand">
        <img src="logo.png" alt="logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'40\' fill=\'%233B92EC\'/></svg>'">
        <span>wizwazwuz</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-btn">
          <span class="material-icons-round">home</span> Home
        </a>
        <a href="projects.html" class="nav-btn active">
          <span class="material-icons-round">folder</span> Projects
        </a>
      </nav>
    </header>

    <div class="heading-bar">
      <h1>Projects</h1>
    </div>

    <div class="projects-grid">
      <!-- Project Card 1 -->
      <div class="project-card">
        <div>
          <div class="card-tags">
            <span class="tag">HTML</span>
            <span class="tag">CSS</span>
          </div>
          <h3>Main Homepage</h3>
          <p>My main GitHub Pages portfolio site.</p>
        </div>
        <div class="card-footer">
          <a href="index.html" class="card-link">
            Open <span class="material-icons-round" style="font-size:16px;">open_in_new</span>
          </a>
        </div>
      </div>
      <!-- Add future project cards above this line -->
    </div>
  </div>

</body>
</html>
