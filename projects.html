<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - wizwazwuz.github.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --sky-blue: #9BE0FF;
      --electric-blue: #3B92EC;
      --deep-navy: #114285;
      --surface: #ffffff;
      --on-surface: #191c1e;
      --outline: #dbe4ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', sans-serif;
    }

    /* Guaranteed layout visibility */
    html, body {
      min-height: 100vh;
      width: 100%;
      background: #eef7ff;
      background: linear-gradient(135deg, #eef7ff 0%, #dbeeff 100%);
      color: var(--on-surface);
      overflow-y: auto !important;
    }

    .app-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid rgba(59, 146, 236, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 700;
      font-size: 1.3rem;
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .nav-btn.active {
      background: var(--electric-blue);
      color: #ffffff;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(59, 146, 236, 0.15);
      color: var(--deep-navy);
      padding: 0.4rem 0.8rem;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-right: 0.5rem;
    }

    .heading-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .heading-bar h1 {
      font-size: 1.8rem;
      color: var(--deep-navy);
    }

    .add-btn {
      background: var(--deep-navy);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(17, 66, 133, 0.2);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(17, 66, 133, 0.08);
      border: 1px solid var(--outline);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .tag {
      background: #eef7ff;
      color: var(--electric-blue);
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .project-card h3 {
      color: var(--deep-navy);
      font-size: 1.2rem;
      margin-bottom: 0.4rem;
    }

    .project-card p {
      color: #55606e;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid #f0f4f8;
    }

    .card-link {
      color: var(--electric-blue);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #e53935;
      cursor: pointer;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 66, 133, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      width: 90%;
      max-width: 440px;
      border-radius: 16px;
      padding: 1.5rem;
    }

    .modal-box h2 {
      color: var(--deep-navy);
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--deep-navy);
      margin-bottom: 0.3rem;
    }

    .field input, .field textarea {
      width: 100%;
      padding: 0.65rem;
      border: 1px solid var(--outline);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    .cancel-btn {
      background: #eef4f8;
      color: var(--deep-navy);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <a href="index.html" class="brand">
        <img src="logo.png" alt="logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'40\' fill=\'%233B92EC\'/></svg>'">
        <span>wizwazwuz</span>
      </a>
      <nav class="nav-links">
        <div id="userChip" class="user-chip">
          <span class="material-icons-round" style="font-size:16px;">verified_user</span> petermaxwellkrol@gmail.com
        </div>
        <a href="index.html" class="nav-btn">
          <span class="material-icons-round">home</span> Home
        </a>
        <a href="projects.html" class="nav-btn active">
          <span class="material-icons-round">folder</span> Projects
        </a>
      </nav>
    </header>

    <div class="heading-bar">
      <h1>Projects</h1>
      <button class="add-btn" onclick="toggleModal(true)">
        <span class="material-icons-round">add</span> Add Project
      </button>
    </div>

    <div class="projects-grid" id="grid">
      <!-- Fallback static HTML card so the page is never blank even without JS -->
      <div class="project-card">
        <div>
          <div class="card-tags">
            <span class="tag">HTML</span>
            <span class="tag">CSS</span>
          </div>
          <h3>Main Homepage</h3>
          <p>My GitHub.io landing page built with Material design styling.</p>
        </div>
        <div class="card-footer">
          <a href="index.html" class="card-link">
            Open <span class="material-icons-round" style="font-size:16px;">open_in_new</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal-box">
      <h2>Add New Project</h2>
      <div class="field">
        <label>Title</label>
        <input type="text" id="pTitle" placeholder="Project Title">
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="pTags" placeholder="Roblox, Web, Python">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="pDesc" rows="3" placeholder="What is this project about?"></textarea>
      </div>
      <div class="field">
        <label>Link URL</label>
        <input type="text" id="pLink" value="#">
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="toggleModal(false)">Cancel</button>
        <button class="add-btn" onclick="addProject()">Add</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'wizwazwuz_projects_data';

    function loadProjects() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        renderProjects(JSON.parse(saved));
      }
    }

    function renderProjects(projects) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      projects.forEach((p, index) => {
        const tagMarkup = p.tags && p.tags.length 
          ? p.tags.map(t => `<span class="tag">${t}</span>`).join('') 
          : '<span class="tag">Project</span>';

        const card = document.createElement('div');
        card.className = 'project-card';
        card.innerHTML = `
          <div>
            <div class="card-tags">${tagMarkup}</div>
            <h3>${p.title}</h3>
            <p>${p.desc}</p>
          </div>
          <div class="card-footer">
            <a href="${p.link}" class="card-link" target="_blank">
              Open <span class="material-icons-round" style="font-size:16px;">open_in_new</span>
            </a>
            <button class="delete-btn" onclick="deleteProject(${index})">
              <span class="material-icons-round">delete</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleModal(show) {
      document.getElementById('modal').classList.toggle('open', show);
    }

    function addProject() {
      const title = document.getElementById('pTitle').value || 'Untitled Project';
      const tags = document.getElementById('pTags').value.split(',').map(t => t.trim()).filter(Boolean);
      const desc = document.getElementById('pDesc').value || 'No description provided.';
      const link = document.getElementById('pLink').value || '#';

      const current = localStorage.getItem(STORAGE_KEY) ? JSON.parse(localStorage.getItem(STORAGE_KEY)) : [];
      current.unshift({ title, tags, desc, link });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
      renderProjects(current);

      document.getElementById('pTitle').value = '';
      document.getElementById('pTags').value = '';
      document.getElementById('pDesc').value = '';
      document.getElementById('pLink').value = '#';
      toggleModal(false);
    }

    function deleteProject(index) {
      const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      current.splice(index, 1);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
      renderProjects(current);
    }

    // Load saved data on startup
    loadProjects();
  </script>

</body>
</html>
