<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - wizwazwuz.github.io</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --sky-blue: #9BE0FF;
      --electric-blue: #3B92EC;
      --deep-navy: #114285;
      --bg-gradient: linear-gradient(135deg, #eef7ff 0%, #dbeeff 100%);
      --surface: #ffffff;
      --on-surface: #191c1e;
      --outline: #dbe4ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', 'Roboto', sans-serif;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--on-surface);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 2px solid rgba(59, 146, 236, 0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 500;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(59, 146, 236, 0.1);
    }

    .nav-btn.active {
      background: var(--electric-blue);
      color: white;
    }

    .action-btn {
      background: var(--deep-navy);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(17, 66, 133, 0.2);
    }

    .action-btn:hover {
      background: #0d346b;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: 1.5rem;
      min-height: 0;
    }

    .page-title {
      font-size: 1.75rem;
      color: var(--deep-navy);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .projects-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      padding-right: 0.5rem;
      padding-bottom: 1rem;
    }

      background: var(--surface);
