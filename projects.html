<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - wizwazwuz.github.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --sky-blue: #9BE0FF;
      --electric-blue: #3B92EC;
      --deep-navy: #114285;
      --surface: #ffffff;
      --on-surface: #191c1e;
      --outline: #dbe4ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', 'Roboto', sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(135deg, #eef7ff 0%, #dbeeff 100%);
      color: var(--on-surface);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 2px solid rgba(59, 146, 236, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 500;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: rgba(59, 146, 236, 0.1);
    }

    .nav-btn.active {
      background: var(--electric-blue);
      color: #ffffff;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(59, 146, 236, 0.15);
      color: var(--deep-navy);
      padding: 0.35rem 0.8rem;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .heading-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .heading-bar h1 {
      font-size: 1.6rem;
      color: var(--deep-navy);
    }

    .add-btn {
      background: var(--deep-navy);
      color: white;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 20px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(17, 66, 133, 0.2);
    }

    .add-btn:hover {
      background: #0d346b;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .project-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 4px 16px rgba(17, 66, 133, 0.06);
      border: 1px solid var(--outline);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .tag {
      background: #eef7ff;
      color: var(--electric-blue);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .project-card h3 {
      color: var(--deep-navy);
      font-size: 1.1rem;
      margin-top: 0.5rem;
      margin-bottom: 0.3rem;
    }

    .project-card p {
      color: #55606e;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid #f0f4f8;
    }

    .card-link {
      color: var(--electric-blue);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
